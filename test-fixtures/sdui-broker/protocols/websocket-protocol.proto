syntax = "proto3";

package sdui.broker;

// WebSocket message envelope
message BrokerMessage {
    string messageId = 1;
    int64 timestamp = 2;
    MessageType type = 3;
    bytes payload = 4; // Serialized payload (JSON or binary)
    map<string, string> metadata = 5;
}

enum MessageType {
    UI_RENDER = 0;
    UI_EVENT = 1;
    UI_ACTION = 2;
    STATE_SYNC = 3;
    HEARTBEAT = 4;
    ERROR = 5;
}

// UI Render Message (Server → Client)
message UIRenderMessage {
    string layoutId = 1;
    repeated Component components = 2;
    AnimationConfig animations = 3;
    RenderMode mode = 4; // FULL or DELTA
    map<string, string> metadata = 5;
}

enum RenderMode {
    FULL_RENDER = 0;    // Complete UI replacement
    DELTA_RENDER = 1;   // Partial update
    APPEND = 2;         // Append to existing
}

// Component definition (universal)
message Component {
    string id = 1;
    ComponentType type = 2;
    map<string, string> props = 3;
    repeated Component children = 4;

    // Component-specific configs
    GridConfig gridConfig = 10;
    DrawerConfig drawerConfig = 11;
    ModalConfig modalConfig = 12;
    FormConfig formConfig = 13;
    ChartConfig chartConfig = 14;
}

enum ComponentType {
    // Grids
    CLIENT_SIDE_GRID = 0;
    SERVER_SIDE_GRID = 1;
    EDITABLE_GRID = 2;
    MASTER_DETAIL_GRID = 3;

    // Layout
    DRAWER = 10;
    MODAL = 11;
    OVERLAY = 12;
    TABS = 13;
    ACCORDION = 14;
    STEPPER = 15;

    // Forms
    TEXT_INPUT = 20;
    NUMBER_INPUT = 21;
    SELECT = 22;
    AUTOCOMPLETE = 23;
    DATE_PICKER = 24;
    FILE_UPLOAD = 25;

    // Data Viz
    LINE_CHART = 30;
    BAR_CHART = 31;
    PIE_CHART = 32;
    KPI_CARD = 33;

    // Basic
    BUTTON = 40;
    TEXT = 41;
    CONTAINER = 42;
    DIVIDER = 43;
}

// Grid Configuration
message GridConfig {
    GridMode mode = 1;
    repeated ColumnDef columns = 2;
    repeated Row rows = 3; // For client-side
    ServerSideConfig serverSideConfig = 4; // For server-side
    bool pagination = 5;
    int32 pageSize = 6;
    string rowSelection = 7; // single, multiple
    bool enableFiltering = 8;
    bool enableSorting = 9;
    RowStyleConfig rowStyle = 10;
}

enum GridMode {
    CLIENT_SIDE = 0;
    SERVER_SIDE = 1;
    INFINITE_SCROLL = 2;
}

message ColumnDef {
    string field = 1;
    string headerName = 2;
    string type = 3; // text, number, date
    bool sortable = 4;
    bool filterable = 5;
    int32 width = 6;
    bool editable = 7;
}

message Row {
    string id = 1;
    map<string, string> data = 2;
    string rowClass = 3; // CSS class
    string rowColor = 4; // Direct color
    map<string, string> cellColors = 5; // Per-cell colors
    repeated Component detailComponents = 6; // For master-detail
}

message ServerSideConfig {
    string dataSourceUrl = 1;
    int32 cacheBlockSize = 2;
    int32 maxBlocksInCache = 3;
}

message RowStyleConfig {
    RowStyleMode mode = 1;
    repeated RowStyleRule rules = 2;
    map<string, string> classes = 3;
}

enum RowStyleMode {
    CLASS_BASED = 0;      // Pattern A: rowClass
    COLOR_BASED = 1;      // Pattern B: direct colors
    RULE_BASED = 2;       // Pattern C: conditional rules
}

message RowStyleRule {
    string condition = 1; // e.g., "status == 'premium'"
    string className = 2;
    string color = 3;
}

// Drawer Configuration
message DrawerConfig {
    DrawerPosition position = 1;
    int32 width = 2; // px
    bool backdrop = 3;
    bool closeOnBackdrop = 4;
    DrawerOpenMode openMode = 5; // How drawer was opened
}

enum DrawerPosition {
    LEFT = 0;
    RIGHT = 1;
    TOP = 2;
    BOTTOM = 3;
}

enum DrawerOpenMode {
    ACTION_BASED = 0;     // Pattern A: UI_ACTION message
    RENDER_BASED = 1;     // Pattern B: Included in UI_RENDER
    STATE_BASED = 2;      // Pattern C: Client state change
}

// Modal Configuration
message ModalConfig {
    string title = 1;
    int32 width = 2;
    int32 height = 3;
    bool backdrop = 4;
    bool closeOnBackdrop = 5;
    bool closeOnEscape = 6;
    repeated ModalButton buttons = 7;
}

message ModalButton {
    string id = 1;
    string label = 2;
    string action = 3; // close, submit, cancel
    string variant = 4; // primary, secondary, danger
}

// Form Configuration
message FormConfig {
    string formId = 1;
    repeated FormField fields = 2;
    ValidationConfig validation = 3;
    string submitAction = 4;
}

message FormField {
    string fieldId = 1;
    string label = 2;
    ComponentType inputType = 3;
    bool required = 4;
    repeated ValidationRule validationRules = 5;
    map<string, string> props = 6;
}

message ValidationConfig {
    ValidationMode mode = 1;
    int32 debounceMs = 2; // For real-time validation
}

enum ValidationMode {
    INLINE = 0;           // Pattern A: Validate on change
    BATCH = 1;            // Pattern B: Validate on submit
    REALTIME_DEBOUNCED = 2; // Pattern C: Debounced real-time
}

message ValidationRule {
    string type = 1; // required, minLength, pattern, custom
    string value = 2;
    string message = 3;
}

// Chart Configuration
message ChartConfig {
    string chartType = 1; // line, bar, pie
    repeated ChartSeries series = 2;
    repeated string categories = 3;
    map<string, string> options = 4;
}

message ChartSeries {
    string name = 1;
    repeated double data = 2;
    string color = 3;
}

// Animation Configuration
message AnimationConfig {
    bool enabled = 1;
    string type = 2; // fade, slide, zoom
    int32 durationMs = 3;
}

// UI Event Message (Client → Server)
message UIEventMessage {
    string eventId = 1;
    EventType eventType = 2;
    string componentId = 3;
    string sessionId = 4;
    map<string, string> data = 5;
    int64 clientTimestamp = 6;
}

enum EventType {
    BUTTON_CLICK = 0;
    ROW_SELECTED = 1;
    ROW_EDITED = 2;
    INPUT_CHANGED = 3;
    FORM_SUBMITTED = 4;
    TAB_CHANGED = 5;
    DRAWER_OPENED = 6;
    DRAWER_CLOSED = 7;
    MODAL_OPENED = 8;
    MODAL_CLOSED = 9;
    FILTER_CHANGED = 10;
    SORT_CHANGED = 11;
    PAGE_CHANGED = 12;
    FILE_UPLOADED = 13;
}

// UI Action Message (Server → Client)
message UIActionMessage {
    string actionId = 1;
    ActionType actionType = 2;
    string targetComponentId = 3;
    map<string, string> params = 4;
}

enum ActionType {
    OPEN_DRAWER = 0;
    CLOSE_DRAWER = 1;
    OPEN_MODAL = 2;
    CLOSE_MODAL = 3;
    SHOW_TOAST = 4;
    NAVIGATE = 5;
    SCROLL_TO = 6;
    FOCUS_FIELD = 7;
    SHOW_VALIDATION = 8;
    UPDATE_CELL = 9;
}

// State Sync Message (Bidirectional)
message StateSyncMessage {
    string stateId = 1;
    StateType stateType = 2;
    bytes stateData = 3; // JSON encoded
    SyncDirection direction = 4;
}

enum StateType {
    GRID_FILTERS = 0;
    GRID_SORT = 1;
    FORM_DATA = 2;
    USER_PREFERENCES = 3;
    PAGINATION = 4;
}

enum SyncDirection {
    CLIENT_TO_SERVER = 0;
    SERVER_TO_CLIENT = 1;
}

// Error Message
message ErrorMessage {
    string errorCode = 1;
    string message = 2;
    string details = 3;
    string relatedMessageId = 4;
}
